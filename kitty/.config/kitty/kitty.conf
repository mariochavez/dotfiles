# vim:fileencoding=utf-8:foldmethod=marker
#
# Kitty — shared between macOS and Omarchy (Arch + Hyprland).
# Ghostty is the primary terminal; this is the fallback. See the ghostty config
# for the reasoning behind the shared-file approach.

#: Theme {{{

# Baseline, and what macOS uses.
include current-theme.conf

# On Omarchy, `omarchy theme set <name>` rewrites this file and kitty follows
# along. Kitty has no "optional include", so this is a glob — a pattern that
# matches nothing is not an error, which is what makes it safe on macOS where
# the path does not exist. It must stay *after* the baseline include: kitty
# applies the last value it reads.
globinclude ~/.local/state/omarchy/current/theme/kitty*.conf

background_opacity 0.95

#: }}}

#: Fonts {{{

font_family      MesloLGS Nerd Font Mono
bold_italic_font auto
font_size 14.0

#: }}}

#: Window {{{

window_padding_width 1
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no

#: }}}

#: Cursor {{{

cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

#: }}}

#: Tabs {{{

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

#: }}}

#: Clipboard {{{

copy_on_select clipboard

# Linux-desktop conventions; harmless on macOS, which uses Cmd+C/V.
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

#: }}}

#: Keyboard {{{

map kitty_mod+enter new_window_with_cwd
map kitty_mod+n new_os_window_with_cwd
map kitty_mod+t new_tab_with_cwd

# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter, and
# Alt+Shift+Enter likewise so tmux can match M-S-Enter.
map shift+enter send_text all \e[13;2u
map alt+shift+enter send_text all \e[13;4u

#: }}}

#: Remote control {{{

# Omarchy's global keybindings look up a kitty window's cwd over this socket.
# Added by an Omarchy migration; kept here so a fresh stow doesn't lose it.
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

#: }}}
