onboarding = false

[theme]
name = "catppuccin"

[ui]
mouse_capture = true

show_agent_labels_on_pane_borders = false
[advanced]
# Roughly equivalent to tmux history-limit = 50000 lines (~50 MB scrollback).
scrollback_limit_bytes = 52428800

[keys]
# tmux: set -g prefix C-a
prefix = "ctrl+a"

# tmux: bind | split-window -h   (side-by-side, vertical divider)
# tmux: bind - split-window -v   (stacked, horizontal divider)
# Bind to the literal `|` character (what the terminal sends on Shift+\) rather
# than composing `shift+backslash` keycodes, which doesn't fire on this setup.
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# Pane navigation lives in the herdr-splits keys.command bindings below, not in
# the built-in `focus_pane_*` keys: those fire unconditionally and swallow
# ctrl+hjkl before nvim ever sees them (tmux solved this with the
# vim-tmux-navigator `if-shell "$is_vim" send-keys` snippet, which has no
# built-in equivalent here).
# Note: ctrl+h collides with Backspace in most terminals; if backspace stops
# working in panes, drop `ctrl+h` and use `prefix+h` for left navigation.

# Pane resizing (tmux used arrow keys with -r repeat).
# Herdr uses a dedicated resize mode entered via a single keybinding.
resize_mode = "prefix+r"
# Reload config: herdr already binds this to `prefix+shift+r` by default
# (action: reload_config), so no custom command is needed.

# Plugin File Viewer 
# https://github.com/smarzban/herdr-file-viewer
[[keys.command]]              # open in a split beside your work
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]]              # …or in its own tab
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

# Seamless nvim-split / herdr-pane navigation and resizing.
# https://github.com/lmilojevicc/herdr-splits.nvim
# Each action checks the focused pane's foreground process: if it's nvim the
# chord is forwarded into the editor, otherwise herdr moves focus itself.
# The nvim half is ~/.config/nvim/lua/plugins/navigator.lua.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

# ctrl+l no longer reaches the shell as clear-screen (herdr-splits claims it in
# non-nvim panes), so re-send the real keystroke to the focused pane behind the
# prefix.
#
# Resolves herdr through $HERDR_BIN_PATH and parses the pane id with /usr/bin
# tools rather than calling `herdr` and `jq` by bare name: the server runs these
# commands with its own PATH, which need not carry ~/.local/bin or Homebrew.
# The plugin scripts use the same $HERDR_BIN_PATH fallback for this reason.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = '''h="${HERDR_BIN_PATH:-$HOME/.local/bin/herdr}"; "$h" pane send-keys "$("$h" pane current | grep -o '"pane_id":"[^"]*"' | head -1 | cut -d'"' -f4)" ctrl+l'''
